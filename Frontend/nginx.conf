map "$realip_remote_addr:$http_x_forwarded_proto" $origen_proto {
    default $scheme;
    "172.31.254.2:https" https;
    "172.31.254.3:https" https;
}
server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 8m;
    # Solo el conector con IP fija del perfil cloudflare puede indicar la IP real.
    set_real_ip_from 172.31.254.2;
    set_real_ip_from 172.31.254.3;
    real_ip_header CF-Connecting-IP;
    resolver 127.0.0.11 valid=10s ipv6=off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    location = /salud { access_log off; default_type text/plain; return 200 "ok\n"; }
    location /api/ {
        # Resolución dinámica: una actualización de API no exige reiniciar Nginx.
        set $servidor_api http://api:3000;
        proxy_pass $servidor_api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $origen_proto;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
        proxy_send_timeout 30s;
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
    }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    # No entregar HTML como si fuera un worklet, una imagen o un script faltante.
    location ~* \.(js|css|png|jpg|jpeg|webp|svg|ico|woff2?)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
