map "$realip_remote_addr:$http_x_forwarded_proto" $origen_proto {
    default $scheme;
    "172.31.254.2:https" https;
    "172.31.254.3:https" https;
}
server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 8m;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/css application/javascript image/svg+xml;
    # Solo el conector con IP fija del perfil cloudflare puede indicar la IP real.
    set_real_ip_from 172.31.254.2;
    set_real_ip_from 172.31.254.3;
    real_ip_header CF-Connecting-IP;
    resolver 127.0.0.11 valid=10s ipv6=off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    location = /favicon.ico {
        absolute_redirect off;
        return 302 /favicon.svg;
    }
    location = /salud { access_log off; default_type text/plain; return 200 "ok\n"; }
    location = /comercial { absolute_redirect off; return 302 /comercial/; }
    location = /operador { absolute_redirect off; return 302 /operador/; }
    location ^~ /operador/ {
        set $control http://operador:8080;
        proxy_pass $control$request_uri;
        proxy_set_header Host $http_host;
    }
    location ^~ /comercial/ {
        try_files $uri $uri/ =404;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        add_header Cache-Control no-cache always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;
    }
    location = /api/v1/agentes/audio/conversar {
        # El ticket dura 30 segundos y se usa una vez. No registrar su URL.
        access_log off;
        set $servidor_voz http://voice-agent:7860;
        proxy_pass $servidor_voz/conversar$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 190s;
        proxy_send_timeout 30s;
        proxy_buffering off;
    }
    location /api/ {
        # Resolución dinámica: una actualización de API no exige reiniciar Nginx.
        set $servidor_api http://api:3000;
        proxy_pass $servidor_api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $origen_proto;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
        proxy_send_timeout 30s;
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
    }
    location = /sw.js { try_files $uri =404; add_header Cache-Control "no-store" always; add_header Service-Worker-Allowed "/"; }
    location = /manifest.webmanifest { try_files $uri =404; default_type application/manifest+json; add_header Cache-Control "no-cache"; }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    # No entregar HTML como si fuera un worklet, una imagen o un script faltante.
    location ~* \.(js|css|png|jpg|jpeg|webp|svg|ico|woff2?)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
