<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><title>Restaurante pequeño · ABINOVA</title><desc>Oferta editorial con fotografía completa y logo estático. No se cubren rostros ni se muestran precios.</desc><rect width="1080" height="1350" fill="#211d55"/><image x="0" y="0" width="1080" height="860" preserveAspectRatio="xMidYMid meet" href="../../recursos/originales/04.png"/><svg x="50" y="875" width="245" height="56" viewBox="0 0 440 100"><title>ABINOVA</title><svg width="100" height="100" viewBox="0 0 100 100"><title>ABINOVA · nova</title><desc>Tres órbitas azules y violetas alrededor de un núcleo luminoso. Fondo transparente.</desc><defs><linearGradient id="nova-orbita" x2="1" y2="1"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient><radialGradient id="nova-nucleo"><stop stop-color="#e0f2fe"/><stop offset=".45" stop-color="#60a5fa"/><stop offset="1" stop-color="#7c3aed"/></radialGradient></defs><g fill="none" stroke="url(#nova-orbita)" stroke-width="4"><ellipse cx="50" cy="50" rx="43" ry="17"/><ellipse cx="50" cy="50" rx="43" ry="17" transform="rotate(60 50 50)"/><ellipse cx="50" cy="50" rx="43" ry="17" transform="rotate(120 50 50)"/></g><path fill="url(#nova-nucleo)" d="m50 29 6 15 15 6-15 6-6 15-6-15-15-6 15-6Z"/><circle cx="88" cy="40" r="4" fill="#2563eb"/><circle cx="30" cy="17" r="3" fill="#8b5cf6"/></svg><text x="120" y="66" fill="#ffffff" font-family="Space Grotesk,Segoe UI,sans-serif" font-size="51" font-weight="700" letter-spacing="2">ABINOVA</text></svg><text x="50" y="975" fill="#fff" font-family="Segoe UI, sans-serif" font-size="37" font-weight="700"><tspan x="50" dy="0">Restaurante pequeño</tspan></text><text x="50" y="1145" fill="#d6ceff" font-family="Segoe UI, sans-serif" font-size="56" font-weight="700"><tspan x="50" dy="0">50 % de descuento anual</tspan></text><text x="50" y="1200" fill="#8ce3ef" font-family="Segoe UI, sans-serif" font-size="32" font-weight="700"><tspan