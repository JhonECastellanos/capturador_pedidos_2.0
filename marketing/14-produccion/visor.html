<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Enfoques A/B · ABINOVA</title><style>*{box-sizing:border-box}body{margin:0;background:#142b29;color:#fff;font:16px/1.5 'Segoe UI',sans-serif}main{max-width:1000px;margin:auto;padding:25px}nav{display:flex;flex-wrap:wrap;gap:18px;align-items:center}a{color:#cbe3c4}button{padding:10px 20px;font:inherit;border-radius:6px;border:1px solid #cbe3c4;background:#142b29;color:#fff;cursor:pointer}img{display:block;width:100%;height:55vh;object-fit:contain;margin:25px 0}section{padding:25px 0;border-top:1px solid #cbe3c4}h1{font-size:clamp(26px,5vw,42px);line-height:1.15}#estado{color:#cbe3c4}</style></head><body><main><nav><a href="galeria.html">← Galería</a><button id="a" type="button">A · Dolor</button><button id="b" type="button">B · Solución</button></nav><img id="foto" alt="Fotografía original ilustrativa"><section><p>ABINOVA</p><h1 id="titulo">Cargando…</h1><p id="copy"></p><p id="estado">Vista editorial de texto y foto; sin ejecución ni renderizado de video.</p><a id="storyboard">STORYBOARD</a> · <a id="prompt">PROMPTANIMACION</a></section></main><script src="visor-datos.js"></script><script>
(async()=>{const q=new URLSearchParams(location.search),id=Number(q.get('perfil')||1),angulo=Number(q.get('angulo')||1),red=q.get('red')||'facebook';const vs=window.VERSIONES_VISOR||[];const foto=document.getElementById('foto');foto.src='../recursos/originales/'+String(id).padStart(2,'0')+'.png';function mostrar(version){const v=vs.find(v=>v.persona_id===id&&v.angulo===angulo&&v.red===red&&v.version===version);if(!v)throw Error('Concepto no encontrado');document.getElementById('titulo').textContent=v.titulo+' · '+version;document.getElementById('copy').textContent=v.copy;document.getElementById('storyboard').href='../'+v.archivos.storyboard;document.getElementById('prompt').href='../'+v.archivos.prompt;document.getElementById('a').setAttribute('aria-pressed',version==='A');document.getElementById('b').setAttribute('aria-pressed',version==='B');}document.getElementById('a').onclick=()=>mostrar('A');document.getElementById('b').onclick=()=>mostrar('B');mostrar(q.get('version')==='B'?'B':'A');})().catch(e=>document.getElementById('titulo').textContent=e.message);
</script></body></html>
