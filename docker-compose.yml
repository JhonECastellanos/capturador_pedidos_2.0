name: ${COMPOSE_PROJECT_NAME:-abinova}

services:
  workflow-control:
    image: abinova-workflows:local
    build: {context: ., dockerfile: infra/workflows/Dockerfile}
    environment:
      WORKFLOW_ROLE: control
      WORKFLOW_TOKEN_FILE: /run/workflows/control.token
      WORKFLOW_REGISTRY_FILE: /run/workflows/registro.json
      WORKFLOW_MODEL_URL: http://api:3000/api/v1/workflows/modelo
      WORKFLOW_BRIDGE_TOKEN_FILE: /run/workflows/bridge.token
    volumes:
      - ./.local/workflows/control.token:/run/workflows/control.token:ro
      - ./.local/workflows/registro.json:/run/workflows/registro.json:ro
      - ./.local/workflows/bridge.token:/run/workflows/bridge.token:ro
      - workflow_control_data:/datos
    networks: [control_workflows]
    restart: unless-stopped
    mem_limit: 192m
    cpus: 0.5
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
  workflow-empresa:
    image: abinova-workflows:local
    build: {context: ., dockerfile: infra/workflows/Dockerfile}
    environment:
      WORKFLOW_ROLE: empresa
      WORKFLOW_TENANT_ID: ${WORKFLOW_TENANT_ID:-principal}
      WORKFLOW_TOKEN_FILE: /run/workflows/empresa.token
      WORKFLOW_BRIDGE_TOKEN_FILE: /run/workflows/bridge.token
      WORKFLOW_MODEL_URL: http://api:3000/api/v1/workflows/modelo
      WORKFLOW_HEALTH_URL: http://frontend:8080/api/v1/salud
      WORKFLOW_SOURCES_FILE: /run/workflows/fuentes.json
    volumes:
      - ./.local/workflows/empresa.token:/run/workflows/empresa.token:ro
      - ./.local/workflows/bridge.token:/run/workflows/bridge.token:ro
      - ./.local/workflows/fuentes.json:/run/workflows/fuentes.json:ro
      - workflow_empresa_data:/datos
    networks: [default, control_workflows]
    restart: unless-stopped
    mem_limit: 192m
    cpus: 0.5
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
  operador:
    image: abinova-operador:local
    build: {context: ., dockerfile: Frontend/Dockerfile, target: operador}
    ports: ["127.0.0.1:8792:8080"]
    depends_on:
      api: {condition: service_healthy}
    networks: [default]
    restart: unless-stopped
    mem_limit: 96m
    cpus: 0.25
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
  redis:
    image: redis:7-alpine
    user: redis
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    restart: unless-stopped
    mem_limit: ${REDIS_MEMORY:-128m}
    memswap_limit: ${REDIS_MEMORY:-128m}
    cpus: ${REDIS_CPUS:-0.5}
    read_only: true
    tmpfs: ["/data:size=16m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 10
  frontend:
    image: abinova-frontend:local
    build:
      context: .
      dockerfile: Frontend/Dockerfile
      target: cliente
    ports: ["${FRONTEND_BIND:-0.0.0.0}:${FRONTEND_PORT:-8080}:8080"]
    depends_on:
      api:
        condition: service_healthy
    networks: [default, tunel]
    restart: unless-stopped
    mem_limit: ${FRONTEND_MEMORY:-128m}
    memswap_limit: ${FRONTEND_MEMORY:-128m}
    cpus: ${FRONTEND_CPUS:-0.5}
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128

  # Optativo: no se inicia ni publica nada sin token y perfil explícitos.
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["cloudflare"]
    command: ["tunnel", "--no-autoupdate", "run", "--token-file", "/run/secrets/cloudflare_token"]
    secrets: [cloudflare_token]
    networks:
      tunel:
        ipv4_address: 172.31.254.2
    depends_on:
      frontend:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.5
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  postgres:
    image: postgres:17-alpine
    mem_limit: ${POSTGRES_MEMORY:-512m}
    memswap_limit: ${POSTGRES_MEMORY:-512m}
    cpus: ${POSTGRES_CPUS:-1.0}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-abinova}
      POSTGRES_USER: ${POSTGRES_USER:-abinova}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-abinova} -d ${POSTGRES_DB:-abinova}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: abinova-api:local
    mem_limit: 768m
    memswap_limit: 768m
    cpus: 1.0
    # Contexto en la raíz: la API es un workspace que depende de @abinova/contrato.
    build:
      context: .
      dockerfile: Backend/Dockerfile
    command: sh -c "npx prisma migrate deploy --schema prisma/schema.prisma && npx prisma db seed --schema prisma/schema.prisma"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SYSTEM_EMAIL: ${SYSTEM_EMAIL:-system@abinova.local}
      SYSTEM_PASSWORD: ${SYSTEM_PASSWORD:-}
      BOOTSTRAP_PASSWORD: ${BOOTSTRAP_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: abinova-api:local
    mem_limit: ${API_MEMORY:-512m}
    memswap_limit: ${API_MEMORY:-512m}
    cpus: ${API_CPUS:-1.0}
    build:
      context: .
      dockerfile: Backend/Dockerfile
    command: sh -c "node dist/main.js"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      CACHE_REDIS_URL: redis://redis:6379
      AGENT_CONFIG_SECRET: ${AGENT_CONFIG_SECRET:-}
      VOICE_AGENT_TOKEN: ${VOICE_AGENT_TOKEN:-}
      VOICE_AGENT_URL: http://voice-agent:7860
      OLLAMA_URL: ${OLLAMA_URL:-http://voice-agent:11434}
      WORKFLOW_CONTROL_URL: http://workflow-control:8090
      WORKFLOW_CONTROL_TOKEN_FILE: /run/workflows/control.token
      WORKFLOW_BRIDGE_TOKEN_FILE: /run/workflows/bridge.token
      WORKFLOW_INCLUDED_PROVIDER_FILE: /run/workflows/proveedor-incluido.json
      WORKFLOW_CONOCIMIENTO_ACTIVO: "true"
      WORKFLOW_TENANT_ID: ${WORKFLOW_TENANT_ID:-principal}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TTL_SEGUNDOS: ${JWT_ACCESS_TTL_SEGUNDOS:-900}
      JWT_REFRESH_TTL_DIAS: ${JWT_REFRESH_TTL_DIAS:-7}
      JWT_ISSUER: ${JWT_ISSUER:-abinova-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-abinova}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-http://localhost:5173},${APP_ORIGIN:-http://localhost:8080}
      TRUST_PROXY_HOPS: 1
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Bogota}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-300}
      RATE_LIMIT_VENTANA: ${RATE_LIMIT_VENTANA:-1 minute}
      PORT: 3000
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio}
      MINIO_PORT: ${MINIO_PORT:-9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-abinova-archivos}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    restart: unless-stopped
    volumes:
      - ./.local/workflows/control.token:/run/workflows/control.token:ro
      - ./.local/workflows/bridge.token:/run/workflows/bridge.token:ro
      - ./.local/workflows/proveedor-incluido.json:/run/workflows/proveedor-incluido.json:ro
    networks: [default, control_workflows]

  # Crea el primer administrador. Es puntual y opcional: no arranca con el
  # resto de servicios (perfil `bootstrap`) y solo se ejecuta una vez, cuando
  # todavía no existe ningún administrador.
  #
  #   docker compose --profile bootstrap run --rm bootstrap
  bootstrap:
    image: abinova-api:local
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5
    build:
      context: .
      dockerfile: Backend/Dockerfile
    profiles: ["bootstrap"]
    entrypoint: ["npx", "tsx", "prisma/bootstrap.ts"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      BOOTSTRAP_EMAIL: ${BOOTSTRAP_EMAIL}
      BOOTSTRAP_PASSWORD: ${BOOTSTRAP_PASSWORD}
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Almacenamiento privado de imágenes y comprobantes; acceso mediante la API.
  #
  # MinIO dejó de publicar imágenes accesibles en Docker Hub y en quay.io, así
  # que se usa la última imagen archivada de Bitnami (`bitnamilegacy`). Si tu
  # equipo tiene acceso a un registro propio, cambia solo la línea `image`.
  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    mem_limit: ${MINIO_MEMORY:-384m}
    memswap_limit: ${MINIO_MEMORY:-384m}
    cpus: ${MINIO_CPUS:-0.5}
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-abinova}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/bitnami/minio/data
    # Para abrir la consola desde el navegador, descomenta y entra a
    # http://localhost:9001
    # ports:
    #   - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  voice-agent:
    profiles: ["voz"]
    image: abinova-voz:local
    build:
      context: .
      dockerfile: Agentes/voz/Dockerfile
      target: ${VOICE_BUILD_TARGET:-voz-hibrida}
    mem_limit: ${VOICE_MEMORY:-1536m}
    memswap_limit: ${VOICE_MEMORY:-1536m}
    cpus: ${VOICE_CPUS:-2}
    restart: unless-stopped
    environment:
      VOICE_AGENT_TOKEN: ${VOICE_AGENT_TOKEN:-}
      HF_HOME: /data/modelos
    volumes:
      - voz_modelos:/data/modelos
    tmpfs:
      - /tmp:size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

volumes:
  workflow_control_data:
  workflow_empresa_data:
  voz_modelos:
    name: ${VOICE_MODELS_VOLUME:-${COMPOSE_PROJECT_NAME:-abinova}_voz_modelos}
    external: ${VOICE_MODELS_EXTERNAL:-false}
  postgres_data:
    name: ${POSTGRES_DATA_VOLUME:-${COMPOSE_PROJECT_NAME:-abinova}_postgres_data}
    external: ${POSTGRES_DATA_EXTERNAL:-false}
  minio_data:
    name: ${MINIO_DATA_VOLUME:-${COMPOSE_PROJECT_NAME:-abinova}_minio_data}
    external: ${MINIO_DATA_EXTERNAL:-false}

networks:
  control_workflows:
  tunel:
    ipam:
      config: [{ subnet: 172.31.254.0/29 }]

secrets:
  cloudflare_token:
    file: ${CLOUDFLARE_TOKEN_FILE:-.local/cloudflare-token}
