server {
  listen 8080;
  server_name _;
  server_tokens off;
  absolute_redirect off;
  root /usr/share/nginx/html;
  index index.html;
  resolver 127.0.0.11 valid=10s ipv6=off;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy same-origin always;
  add_header Cache-Control no-cache always;
  location = /salud { access_log off; default_type text/plain; return 200 "ok\n"; }
  location = / { try_files /index.html =404; }
  location = /operador { return 302 /operador/; }
  location ^~ /operador/ { rewrite ^/operador/(.*)$ /$1 last; }
  location /api/ {
    set $api http://api:3000;
    proxy_pass $api$request_uri;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 60s;
    add_header Cache-Control no-store always;
  }
  location /assets/ { try_files $uri =404; expires 1y; }
  location = /sw.js { return 404; }
  location = /manifest.webmanifest { return 404; }
  location ~* \.(js|css|png|svg|ico|woff2?|ttf)$ { try_files $uri =404; }
  location / { try_files $uri $uri/ /index.html; }
}
